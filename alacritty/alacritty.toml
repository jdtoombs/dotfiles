[font]
size = 12.0


[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"


[terminal.shell]
program = "wsl.exe"
args = ["-d", "Ubuntu-24.04", "--cd", "~"]

[colors.primary]

background = "#1a1b26"
foreground = "#c0caf5"


[colors.normal]
black = "#15161e"
red = "#f7768e"
green = "#9ece6a"

yellow = "#e0af68"

blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#a9b1d6"

[colors.bright]
black = "#414868"

red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#bb9af7"
cyan = "#7dcfff"
white = "#c0caf5"
