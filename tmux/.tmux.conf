set -g status-style 'bg=#1a1b26 fg=#c0caf5'

set -g status-position bottom

set -g status-left '#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#3b4261,fg=#7aa2f7]#[bg=#3b4261,fg=#c0caf5] #(whoami) #[bg=#1a1b26,fg=#3b4261]'
set -g status-left-length 60

set -g status-right '#(pi-agents-status)#[bg=#1a1b26,fg=#3b4261]#[bg=#3b4261,fg=#c0caf5] %Y-%m-%d #[bg=#3b4261,fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1b26,bold] %H:%M '
set -g status-right-length 90
set -g status-interval 5

set -g window-status-format '#{?#{==:#{window_name},π-dash},#[bg=#ff79c6#,fg=#1a1b26#,bold] #I:#W #[bg=#1a1b26#,fg=#ff79c6],#[bg=#1a1b26#,fg=#565f89] #I:#W }'
set -g window-status-current-format '#{?#{==:#{window_name},π-dash},#[bg=#ff79c6#,fg=#1a1b26#,bold] #I:#W #[bg=#1a1b26#,fg=#ff79c6],#[bg=#3b4261#,fg=#1a1b26]#[bg=#3b4261#,fg=#7aa2f7#,bold] #I:#W #[bg=#1a1b26#,fg=#3b4261]}'

set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#e0af68,bold'

# Dim inactive panes, full brightness on active
set -g window-style 'bg=#16161e'
set -g window-active-style 'bg=#1a1b26'

set -g message-style 'bg=#7aa2f7 fg=#1a1b26'

set -g base-index 1
set -g pane-base-index 1

# When a new tmux session starts, turn the initial window into a simple
# three-tab workspace in the directory tmux was launched from.
set-hook -g after-new-session 'if -F "#{==:#{session_windows},1}" "rename-window nvim; new-window -n agents -c \"#{pane_current_path}\"; new-window -n servers -c \"#{pane_current_path}\"; new-window -n notes -c \"#{pane_current_path}\"; select-window -t 1"'

# Enable focus events for neovim triggers
set -g focus-events on

setw -g mode-keys vi

# Vim-style pane navigation (Alt+h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pi launch bindings
# Prefix + A: open a fresh Pi agent in the current pane's directory
# Prefix + C: continue the latest Pi session in the current pane's directory
# Prefix + R: open a read-only Pi reviewer in the current pane's directory
bind-key A new-window -n pi -c "#{pane_current_path}" "pi"
bind-key C new-window -n pi-cont -c "#{pane_current_path}" "pi --continue"
bind-key R new-window -n pi-review -c "#{pane_current_path}" "pi --tools read,grep,find,ls"

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Pi: preserve modified keys inside tmux (Shift+Enter, Ctrl+Enter, etc.)
set -g extended-keys on
# tmux 3.5+ supports choosing CSI-u format; older versions (e.g. 3.4) do not.
if -F '#{>=:#{version},3.5}' 'set -g extended-keys-format csi-u'

# Prefix + d: jump to the Pi agents dashboard instead of detaching tmux
unbind-key d
bind-key d run-shell "pi-agents-open"
