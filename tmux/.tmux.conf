set -g status-style 'bg=#1a1b26 fg=#c0caf5'

set -g status-position bottom

set -g status-left '#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#3b4261,fg=#7aa2f7]#[bg=#3b4261,fg=#c0caf5] #(whoami) #[bg=#1a1b26,fg=#3b4261]'
set -g status-left-length 60

set -g status-right '#[bg=#1a1b26,fg=#3b4261]#[bg=#3b4261,fg=#c0caf5] %Y-%m-%d #[bg=#3b4261,fg=#7aa2f7]#[bg=#7aa2f7,fg=#1a1b26,bold] %H:%M '
set -g status-right-length 50

set -g window-status-format '#[bg=#1a1b26,fg=#565f89] #I:#W '
set -g window-status-current-format '#[bg=#3b4261,fg=#1a1b26]#[bg=#3b4261,fg=#7aa2f7,bold] #I:#W #[bg=#1a1b26,fg=#3b4261]'

set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#e0af68,bold'

# Dim inactive panes, full brightness on active
set -g window-style 'bg=#16161e'
set -g window-active-style 'bg=#1a1b26'

set -g message-style 'bg=#7aa2f7 fg=#1a1b26'

set -g base-index 1
set -g pane-base-index 1

# Enable focus events for neovim triggers
set -g focus-events on

setw -g mode-keys vi

# Vim-style pane navigation (Alt+h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

if-shell '! tmux has-session -t main 2>/dev/null' \
  'new-session -d -s main -n gen ; new-window -t main -n nvim ; new-window -t main -n server ; split-window -h -t main:server ; select-pane -t main:server.1 ; new-window -t main -n notes ; select-window -t main:1'

# Pi: preserve modified keys inside tmux (Shift+Enter, Ctrl+Enter, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u
